name: alula_app
description: >-
  Alula Code — MVP 原型 B：Flutter 工作台 + Rust 核心（editor-core），
  验证「编辑 → 增量同步 → Rust 应用 → 版本回执」闭环（docs/03 Phase 0 任务 0-1）。
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  characters: ^1.4.1
  path: ^1.9.1
  super_clipboard: ^0.9.1
  # dart:ffi 的 CString/Utf8 辅助；Flutter 生态事实标准，无传递依赖
  ffi: ^2.1.0
  window_manager: ^0.5.2
  super_drag_and_drop: ^0.9.1
  irondash_engine_context: ^0.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  irondash_message_channel: ^0.7.0
  super_native_extensions: ^0.9.1

dependency_overrides:
  # Upstream publishes the macOS engine handle before its FlutterView registry
  # entry exists. Keep the native fix local until upstream includes the same
  # readiness handshake.
  irondash_engine_context:
    path: packages/irondash_engine_context

flutter:
  uses-material-design: true
  assets:
    - assets/seti/vs-seti-icon-theme.json
    - assets/seti/LICENSE-SETI.md
  fonts:
    - family: AlulaSeti
      fonts:
        - asset: assets/seti/seti.ttf
