name: CI

on:
  push:
    branches: [main]
  pull_request:

# Rust 与 Flutter 各自的全量缓存很大；默认权限够用，不需要额外 token
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 是第一交付平台；Linux 用于 PSS 口径与 mem-probe 跨平台验证
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Repeat async LSP workspace shutdown fixture on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          1..10 | ForEach-Object {
            Write-Host "LSP workspace shutdown iteration $_ / 10"
            cargo test -p editor-core --test p01_async_completion -- --exact completion_is_async_versioned_cancellable_and_bounded
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # core_sync_test 走真实 FFI：先构建核心动态库到 app/native/
      - name: Build Rust core (libalula_core.so)
        run: bash scripts/build_core.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: Analyze
        run: flutter analyze
        working-directory: app
      - name: Tests
        run: flutter test
        working-directory: app

  harness:
    name: Harness 文档结构校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate harness（AGENTS/feature_list/progress/init）
        run: node .agents/skills/harness-creator/scripts/validate-harness.mjs --target .
