name: Platform Availability

on:
  push:
    branches: [codex/vscode-parity-p00]
    paths:
      - 'app/**'
      - 'crates/**'
      - 'scripts/build_core.*'
      - '.github/workflows/platform-availability.yml'

permissions:
  contents: read

jobs:
  linux:
    name: Linux x64 build and launch smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Build Rust core
        run: bash scripts/build_core.sh
      - name: Build Linux Release bundle
        run: flutter build linux --release
        working-directory: app
      - name: Add Rust core and verify Linux bundle
        run: |
          cp app/native/libalula_core.so app/build/linux/x64/release/bundle/
          ! ldd app/build/linux/x64/release/bundle/alula_app | grep -q 'not found'
      - name: Launch Linux app under Xvfb
        run: |
          set +e
          timeout --signal=TERM 12s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            app/build/linux/x64/release/bundle/alula_app
          status=$?
          set -e
          test "$status" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: alula-linux-x64-${{ github.sha }}
          path: app/build/linux/x64/release/bundle

  windows:
    name: Windows x64 build and launch smoke
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Build Rust core
        shell: bash
        run: bash scripts/build_core.sh
      - name: Build Windows Release bundle
        run: flutter build windows --release
        working-directory: app
      - name: Add Rust core DLL
        shell: pwsh
        run: Copy-Item app/native/alula_core.dll app/build/windows/x64/runner/Release/ -Force
      - name: Launch Windows app
        shell: pwsh
        run: |
          $exe = (Resolve-Path app/build/windows/x64/runner/Release/alula_app.exe).Path
          $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) { throw "Alula exited during startup (code $($process.ExitCode))" }
          try { if (!$process.HasExited) { $process.Kill() } } catch [System.InvalidOperationException] { }
          if (!$process.WaitForExit(10000)) { throw "Alula process did not exit after the smoke check" }
      - uses: actions/upload-artifact@v4
        with:
          name: alula-windows-x64-${{ github.sha }}
          path: app/build/windows/x64/runner/Release

  macos:
    name: macOS build, launch smoke, and app package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Build Rust core
        run: bash scripts/build_core.sh
      - name: Flutter analyze and tests
        run: |
          flutter pub get
          flutter analyze
          flutter test
        working-directory: app
      - name: Build macOS Release bundle
        run: flutter build macos --release --no-pub
        working-directory: app
      - name: Bundle and sign Rust core
        run: |
          app_bundle="app/build/macos/Build/Products/Release/alula_app.app"
          install -m 755 app/native/libalula_core.dylib "$app_bundle/Contents/MacOS/libalula_core.dylib"
          codesign --force --deep --sign - "$app_bundle"
          codesign --verify --deep --strict "$app_bundle"
      - name: Launch macOS app
        run: |
          executable="app/build/macos/Build/Products/Release/alula_app.app/Contents/MacOS/alula_app"
          "$executable" > "$RUNNER_TEMP/alula-macos-smoke.log" 2>&1 &
          app_pid=$!
          sleep 12
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/alula-macos-smoke.log"
            wait "$app_pid"
            exit 1
          fi
          kill -TERM "$app_pid" 2>/dev/null || true
          for _ in $(seq 1 20); do
            kill -0 "$app_pid" 2>/dev/null || break
            sleep 0.25
          done
          if kill -0 "$app_pid" 2>/dev/null; then
            kill -KILL "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            echo "Alula did not stop after the launch smoke"
            exit 1
          fi
          wait "$app_pid" || true
      - name: Package macOS app
        run: |
          app_bundle="app/build/macos/Build/Products/Release/alula_app.app"
          package="$RUNNER_TEMP/alula-code-macos-${RUNNER_ARCH}-${GITHUB_SHA}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_bundle" "$package"
          shasum -a 256 "$package" > "$package.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: alula-macos-${{ runner.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/alula-code-macos-${{ runner.arch }}-${{ github.sha }}.zip
            ${{ runner.temp }}/alula-code-macos-${{ runner.arch }}-${{ github.sha }}.zip.sha256
