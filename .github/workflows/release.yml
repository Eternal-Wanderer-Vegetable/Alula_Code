name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # 创建 GitHub Release 需要

jobs:
  windows:
    name: Windows x64 打包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Rust core (alula_core.dll)
        run: bash scripts/build_core.sh
      - name: Flutter build (Release)
        run: flutter build windows --release
        working-directory: app
      - name: 部署核心 DLL 到 exe 同目录
        shell: pwsh
        run: |
          Copy-Item app/native/alula_core.dll app/build/windows/x64/runner/Release/ -Force
      - name: 打 zip
        shell: pwsh
        run: |
          Compress-Archive -Path app/build/windows/x64/runner/Release/* `
            -DestinationPath alula-code-${{ github.ref_name }}-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: alula-code-${{ github.ref_name }}-windows-x64.zip

  linux:
    name: Linux x64 打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Flutter Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Rust core (libalula_core.so)
        run: bash scripts/build_core.sh
      - name: Flutter build (Release)
        run: flutter build linux --release
        working-directory: app
      - name: 部署核心 so 到 bundle 目录
        run: cp app/native/libalula_core.so app/build/linux/x64/release/bundle/
      - name: 打 tar.gz
        run: |
          tar -czf alula-code-${{ github.ref_name }}-linux-x64.tar.gz -C app/build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: alula-code-${{ github.ref_name }}-linux-x64.tar.gz

  publish:
    name: 发布 GitHub Release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            alula-code-*-windows-x64.zip
            alula-code-*-linux-x64.tar.gz
          generate_release_notes: true
        # macOS 打包（dmg/签名）待 Phase 1 打包里程碑（docs/03 §2.1）；届时增加 macos job 并入 needs
